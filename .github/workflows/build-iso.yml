name: Build ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "installer (install to disk) or live (try every desktop, nothing installed)"
        type: choice
        options: [installer, live]
        default: installer

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check the installer compiles
        run: python3 -m compileall -q lunar-setup/lunar_setup

      # Arch's own releng profile, from the archiso package that builds it,
      # with lunar/apply.sh layered on top. Nothing else.
      # The live edition carries every desktop; its build needs more room
      # than the runner leaves free.
      - name: Free disk space
        if: inputs.edition == 'live'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Build the ISO
        run: |
          mkdir -p out
          docker run --rm --privileged -e LUNAR_LIVE=${{ inputs.edition == 'live' && '1' || '0' }} -v "$PWD:/src" -w /src archlinux:latest bash -c '
            set -euo pipefail
            pacman -Syu --noconfirm --needed archiso
            cp -r /usr/share/archiso/configs/releng /tmp/profile
            bash lunar/apply.sh /tmp/profile
            mkarchiso -v -w /tmp/work -o /src/out /tmp/profile
          '
          sudo chown -R "$(id -u):$(id -g)" out
          ls -lh out

      - name: Checksum
        run: cd out && sha256sum *.iso > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.edition == 'live' && 'live' || 'build' }}-$(date -u +%Y%m%d-%H%M)"
          # Release files must be under 2 GB: a larger ISO goes up in parts
          # (join with: copy /b a+b on Windows, cat on Linux and macOS).
          for f in out/*.iso; do
            if [ "$(stat -c %s "$f")" -gt 2000000000 ]; then
              split -b 1900M -d -a 1 "$f" "$f.part" && rm "$f"
            fi
          done
          gh release create "$tag" out/*.iso* out/SHA256SUMS \
            --title "Lunar OS $tag" \
            --notes "Arch releng profile + Lunar OS branding + lunaros-setup."
