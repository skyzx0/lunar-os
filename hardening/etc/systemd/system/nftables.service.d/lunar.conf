# Load Lunar's ruleset instead of the stock one.
#
# The nftables package owns /etc/nftables.conf, and pacman refuses to let two
# packages own the same file. Shipping the ruleset at its own path and
# redirecting the service here avoids that conflict without dropping the
# firewall: the stock file stays in place, unused.
[Service]
ExecStart=
ExecStart=/usr/bin/nft -f /etc/lunar/nftables.conf
ExecReload=
ExecReload=/usr/bin/nft -f /etc/lunar/nftables.conf
