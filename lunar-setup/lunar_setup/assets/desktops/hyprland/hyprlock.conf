# Lunar OS lock screen: the moon behind frosted glass, a large clock, the
# password field.
general {
    hide_cursor = true
    grace = 0
}

background {
    path = /usr/share/wallpapers/Lunar/contents/images/3840x2160.png
    color = rgb(000000)
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    text = $TIME
    font_size = 96
    font_family = Inter
    color = rgb(e2e5f0)
    position = 0, 260
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = Inter
    color = rgba(e2e5f0aa)
    position = 0, 170
    halign = center
    valign = center
}

input-field {
    size = 300, 52
    rounding = 16
    outline_thickness = 2
    outer_color = rgba(969fffcc)
    inner_color = rgba(0a0a10cc)
    font_color = rgb(e2e5f0)
    check_color = rgb(c8a2ff)
    fail_color = rgb(ff7a8a)
    placeholder_text = Password
    fade_on_empty = false
    dots_center = true
    position = 0, -200
    halign = center
    valign = center
}
