# Lunar OS lock screen: the moon, the time, a password field.
background {
    path = /etc/lunaros/wallpaper.png
    color = rgb(000000)
}

label {
    text = $TIME
    font_size = 56
    color = rgb(e2e5f0)
    position = 0, 280
    halign = center
    valign = center
}

input-field {
    size = 260, 44
    outer_color = rgb(969fff)
    inner_color = rgb(0a0a0c)
    font_color = rgb(e2e5f0)
    placeholder_text = Password
    position = 0, -220
    halign = center
    valign = center
}
