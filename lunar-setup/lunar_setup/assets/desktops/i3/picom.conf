# Lunar OS compositor: translucent windows and bar with blur, rounded corners.
backend = "glx";
vsync = true;
corner-radius = 10;
shadow = false;

# Every window is see-through; the one you are using a little less.
active-opacity = 0.92;
inactive-opacity = 0.84;
inactive-opacity-override = false;
# Fullscreen (video, games) stays solid.
opacity-rule = [ "100:_NET_WM_STATE@[*]:32a *= '_NET_WM_STATE_FULLSCREEN'" ];

blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [ "window_type = 'desktop'" ];

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
