# Lunar OS performance and developer limits.
# File watchers: editors, bundlers and test runners watch whole projects.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
# Faster, steadier connections: BBR congestion control with fair queueing,
# TCP Fast Open for both directions.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
