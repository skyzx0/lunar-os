# Live medium only. The installed system gets sddm without autologin.
[Autologin]
User=lunar
Session=plasma
Relogin=false

[General]
# Only Xwayland is installed, so the greeter must not attempt a real X server.
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=lunar
CursorTheme=breeze_cursors
