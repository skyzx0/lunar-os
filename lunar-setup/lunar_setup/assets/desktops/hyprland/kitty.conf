# Lunar OS terminal: black glass, tuned for low input latency.
background            #000000
foreground            #e2e5f0
cursor                #969fff
cursor_blink_interval 0
selection_background  #969fff
selection_foreground  #000000
font_size             11
window_padding_width  10
confirm_os_window_close 0

# Opacity can change live (Lunar Look).
dynamic_background_opacity yes

# Draw a keystroke as soon as it arrives instead of batching frames.
repaint_delay  4
input_delay    1
sync_to_monitor yes

# Transparency and accent: Lunar Look.
include lunar-look.conf
