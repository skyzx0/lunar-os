image efi-part.vfat {
    vfat {
        label = "LUNAR-EFI"
        file EFI {
            image = "efi-part/EFI"
        }
        file bzImage {
            image = "bzImage"
        }
    }
    size = 64M
}

image lunar-core.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition boot {
        image = "efi-part.vfat"
        partition-type-uuid = U
        offset = 1M
        bootable = true
    }

    partition root {
        partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
        partition-uuid = UUID_TMP
        image = "rootfs.ext2"
    }
}
