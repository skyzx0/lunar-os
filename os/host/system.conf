# Lunar OS system settings.
# Change anything here, then apply it with:  sudo ltxs apply

[system]
hostname = lunar
timezone = UTC
keyboard = us
locale   = en_US.UTF-8
boot     = efi

[user]
name     = lunar
fullname = Lunar

[desktop]
session = lunar

[mounts]
# lunar-genconf fills this in from what is mounted when you install.

[apps]
# One app per line. Easiest: sudo ltxs install NAME
