title    Lunar OS install medium
sort-key 01
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-hardened
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux-hardened.img
# No separate microcode initrd: the 'microcode' mkinitcpio hook in
# airootfs/etc/mkinitcpio.conf.d/archiso.conf embeds it in the image.
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0
