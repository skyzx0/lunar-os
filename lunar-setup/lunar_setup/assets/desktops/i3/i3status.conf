# Lunar OS status line.
general {
    colors = true
    color_good = "#e2e5f0"
    color_degraded = "#e5c07b"
    color_bad = "#e06c75"
    interval = 5
}

order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "volume master"
order += "tztime local"

wireless _first_ {
    format_up = "wifi %essid"
    format_down = "wifi off"
}
ethernet _first_ {
    format_up = "wired"
    format_down = ""
}
battery all {
    format = "%status %percentage"
    status_chr = "chg"
    status_bat = "bat"
    status_full = "full"
    low_threshold = 15
}
volume master {
    format = "vol %volume"
    format_muted = "muted"
}
tztime local {
    format = "%H:%M"
}
