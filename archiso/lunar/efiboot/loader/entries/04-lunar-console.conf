title    Lunar OS install medium (console only, no desktop)
sort-key 04
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-hardened
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux-hardened.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.firstboot=off console=tty0 console=ttyS0,115200 cow_spacesize=512M systemd.unit=multi-user.target
