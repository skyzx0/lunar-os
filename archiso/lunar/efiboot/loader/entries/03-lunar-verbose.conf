title    Lunar OS install medium (verbose, no splash)
sort-key 03
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-hardened
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux-hardened.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.firstboot=off console=tty0 console=ttyS0,115200 cow_spacesize=512M systemd.log_level=info
