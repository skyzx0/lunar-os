# Lunar OS - Hyprland
# Your config: edit freely.
#   Super+Return  terminal        Super+D / Super+Space  apps
#   Super+E       files           Super+Q  close          Super+F  fullscreen
#   Super+B       system monitor  Super+A  audio visualiser
#   Super+L       lock            Super+1..9  workspaces  Super+scroll  next/previous

monitor = , preferred, auto, 1

$terminal = kitty
$files    = dolphin
$menu     = wofi --show drun

exec-once = swaybg -m fill -i /usr/share/wallpapers/Lunar/contents/images/3840x2160.png
exec-once = waybar
exec-once = hypridle
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = blueman-applet

env = XCURSOR_SIZE,24

# --- input: fast key repeat (Hyprland's default waits 600 ms, then 25/s) ---
input {
    kb_layout = @XKB_LAYOUT@
    kb_variant = @XKB_VARIANT@
    repeat_delay = 250
    repeat_rate = 50
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(969fffcc) rgba(c8a2ffcc) 45deg
    col.inactive_border = rgba(ffffff10)
    layout = dwindle
    resize_on_border = true
}

# --- look: glass, tuned for integrated graphics -------------------------
decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.94
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        noise = 0.01
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.2
        popups = true
    }
}

# --- motion: short, decelerating curves (Material-style), nothing lingers --
animations {
    enabled = true
    bezier = decel, 0.05, 0.7, 0.1, 1
    bezier = accel, 0.3, 0, 0.8, 0.15
    bezier = menu, 0.1, 1, 0, 1
    animation = windowsIn,  1, 3, decel, popin 85%
    animation = windowsOut, 1, 2, accel, popin 85%
    animation = windowsMove, 1, 3, decel
    animation = border,     1, 6, decel
    animation = fade,       1, 2, decel
    animation = layers,     1, 2, decel, slide
    animation = workspaces, 1, 4, menu, slide
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(000000)
    vfr = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, Space, exec, $menu
bind = $mod, E, exec, $files
bind = $mod, B, exec, $terminal -e btop
bind = $mod, A, exec, $terminal -e cava
bind = $mod, Q, killactive
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, E, exit
bind = $mod, Tab, workspace, previous

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
bind = $mod, 1, workspace, 1
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod, 2, workspace, 2
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod, 7, workspace, 7
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod, 8, workspace, 8
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 9, movetoworkspace, 9

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind   = , Print, exec, mkdir -p "$HOME/Pictures" && grim -g "$(slurp)" "$HOME/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"
