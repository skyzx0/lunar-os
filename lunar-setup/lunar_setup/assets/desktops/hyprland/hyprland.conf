# Lunar OS - Hyprland
# Your config: edit freely.
#   Super+Space / Super+D  apps          Super+Return  terminal     Super+E  files
#   Super+V   clipboard history         Super+N  notifications      Super+Escape  power
#   Super+Q   close    Super+F  fullscreen    Super+T  float    Super+L  lock
#   Super+Shift+S  screenshot of an area (edit, save, copy)    Print  whole screen
#   Super+C   colour picker             Super+I  Lunar Look (colours, glass, wallpaper)
#   Super+1..9  workspaces              Super+scroll  next/previous workspace

monitor = , preferred, auto, 1

$terminal = kitty
$files    = nautilus
$menu     = rofi -show drun

exec-once = swaybg -m fill -i ~/.config/lunaros/wallpaper
exec-once = waybar -c ~/.config/waybar/hyprland.json -s ~/.config/waybar/style.css
exec-once = swaync
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --watch cliphist store

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

# --- input: fast key repeat (Hyprland's default waits 600 ms, then 25/s) ---
input {
    kb_layout = @XKB_LAYOUT@
    kb_variant = @XKB_VARIANT@
    repeat_delay = 250
    repeat_rate = 50
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(969fffee) rgba(c8a2ffee) 45deg
    col.inactive_border = rgba(ffffff12)
    layout = dwindle
    resize_on_border = true
}

# --- look: deep glass, soft shadows, tuned for integrated graphics -----------
decoration {
    rounding = 16
    active_opacity = 0.94
    inactive_opacity = 0.86
    fullscreen_opacity = 1.0
    dim_inactive = false
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000099)
    }
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        noise = 0.015
        contrast = 1.0
        brightness = 0.9
        vibrancy = 0.2
        popups = true
    }
}

# --- motion: short, decelerating curves, nothing lingers --------------------
animations {
    enabled = true
    bezier = decel, 0.05, 0.7, 0.1, 1
    bezier = accel, 0.3, 0, 0.8, 0.15
    bezier = menu, 0.1, 1, 0, 1
    animation = windowsIn,  1, 3, decel, popin 85%
    animation = windowsOut, 1, 2, accel, popin 85%
    animation = windowsMove, 1, 3, decel
    animation = border,     1, 6, decel
    animation = fade,       1, 2, decel
    animation = layers,     1, 2, decel, slide
    animation = workspaces, 1, 4, menu, slide
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(000000)
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    # Lunar has its own dialogs.
    disable_hyprland_guiutils_check = true
}

# --- small tool windows float in the middle --------------------------------
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$, float on
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$, center on
windowrule = match:class ^(blueman-manager|.blueman-manager-wrapped)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(org.gnome.FileRoller|org.gnome.Calculator)$, float on
windowrule = match:class ^(lunar-look)$, float on
windowrule = match:title ^(Lunar Look)$, float on

# --- the bar, launcher and notification centre are glass too ---------------
layerrule = match:namespace ^(waybar)$, blur on
layerrule = match:namespace ^(waybar)$, ignore_alpha 0.2
layerrule = match:namespace ^(rofi)$, blur on
layerrule = match:namespace ^(rofi)$, ignore_alpha 0.2
layerrule = match:namespace ^(swaync-control-center|swaync-notification-window)$, blur on
layerrule = match:namespace ^(swaync-control-center|swaync-notification-window)$, ignore_alpha 0.2

$mod = SUPER

bind = $mod, Space, exec, pkill -x rofi || $menu
bind = $mod, D, exec, pkill -x rofi || $menu
bind = $mod, Return, exec, $terminal
bind = $mod, E, exec, $files
bind = $mod, B, exec, $terminal -e btop
bind = $mod, A, exec, $terminal -e cava
bind = $mod, V, exec, cliphist list | rofi -dmenu -p Clipboard | cliphist decode | wl-copy
bind = $mod, N, exec, swaync-client -t -sw
bind = $mod, Escape, exec, lunar-power
bind = $mod, C, exec, hyprpicker -a
bind = $mod, I, exec, lunar-look
bind = $mod, Q, killactive
bind = $mod, T, togglefloating
bind = $mod, F, fullscreen
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, E, exit
bind = $mod, Tab, workspace, previous

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
bind = $mod, 1, workspace, 1
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod, 2, workspace, 2
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod, 7, workspace, 7
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod, 8, workspace, 8
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 9, movetoworkspace, 9

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous
bind   = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind   = , Print, exec, mkdir -p "$HOME/Pictures/Screenshots" && grim "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png" && notify-send "Screenshot saved" "Pictures/Screenshots"

# Colours, transparency, blur, rounding, animation speed: set in Lunar Look
# (Super+I). Kept last so it takes precedence over the values above.
source = ~/.config/hypr/lunar-look.conf
